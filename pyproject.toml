[project]
name = "prism-llm"
version = "0.1.0"
description = "Experimental context compression for LLM prompts: anchors kept verbatim, repeated phrases replaced by a legend. Early, pre-1.0."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Shubham Dusane", email = "sdusane4@gmail.com" }
]
keywords = ["llm", "tokens", "compression", "context", "agents", "claude", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]
tokenizers = ["tiktoken>=0.5"]
claude = ["anthropic>=0.30"]

[project.scripts]
prism = "prism.cli:main"

[project.urls]
Homepage = "https://github.com/shubhamdusane/prism"
Repository = "https://github.com/shubhamdusane/prism"
Issues = "https://github.com/shubhamdusane/prism/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
